---
# Alternate rulebook: POST to AO webhook via run_module + uri (Anshul's pattern).
# Requires an inventory attached to the EDA activation (e.g. Demo Inventory).
- name: Unknown issue xSOS RCA (run_module)
  hosts: localhost
  sources:
    - name: unknown_issue_sqs
      amazon.aws.aws_sqs_queue:
        region: "{{ aws_region | default('us-east-1') }}"
        name: "{{ xsos_event_queue_name | default('aap-unknown-issue-rca') }}"
        delay_seconds: 5
  rules:
    - name: Trigger AO xSOS workflow for unknown issue events
      condition: >-
        event.body is defined
        and event.body.requested_action is defined
        and event.body.requested_action == "xsos_analysis"
      action:
        run_module:
          name: ansible.builtin.uri
          module_args:
            url: "{{ ao_webhook_url }}"
            method: POST
            validate_certs: "{{ ao_webhook_validate_certs | default(false) }}"
            headers:
              Content-Type: application/json
            body_format: json
            body:
              issue_id: "{{ event.body.issue_id }}"
              host: "{{ event.body.host }}"
              summary: "{{ event.body.summary }}"
              severity: "{{ event.body.severity | default('unknown') }}"
              source: "{{ event.body.source | default('eda-sqs') }}"
              requested_action: "{{ event.body.requested_action }}"
            status_code: [200, 201, 202, 204]
          hosts: localhost
