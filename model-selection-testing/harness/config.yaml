iterations: 3

models:
  - name: claude-sonnet-4-6
    provider: anthropic
  - name: gemini-2.5-pro
    provider: google
  - name: openai/granite-3-2-8b-instruct
    provider: litemaas

workflows:
  # Replace workflow_id and node_id values with your AO instance's UUIDs.
  # Run one workflow/step at a time with:
  #   python3 run.py model-sweep --workflow ticket_classifier --step classify_bug

  - name: ticket_classifier
    workflow_id: f7c4776b-b5b5-4d43-9911-14e3a6095dba
    steps:
      - node_id: classifier
        name: classify_bug
        ground_truth: ground_truth/ticket_classifier/step1_classify_bug.json
      - node_id: classifier
        name: classify_feature
        ground_truth: ground_truth/ticket_classifier/step1_classify_feature.json
      - node_id: classifier
        name: classify_question
        ground_truth: ground_truth/ticket_classifier/step1_classify_question.json
      - node_id: bug_responder
        name: respond_bug
        ground_truth: ground_truth/ticket_classifier/step2_respond_bug.json
      - node_id: feature_responder
        name: respond_feature
        ground_truth: ground_truth/ticket_classifier/step2_respond_feature.json

