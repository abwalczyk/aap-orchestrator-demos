# Update these IDs to match your actual AO workflow and node IDs
workflow_id: "REPLACE_WITH_WORKFLOW_UUID"

steps:
  - name: triage
    node_id: "REPLACE_WITH_TRIAGE_NODE_ID"
    ground_truth_file: step1_triage.json
    description: Classify the incident severity and identify the root cause

  - name: recommend
    node_id: "REPLACE_WITH_RECOMMEND_NODE_ID"
    ground_truth_file: step2_recommend.json
    description: Recommend a remediation action and job template
    depends_on: triage
