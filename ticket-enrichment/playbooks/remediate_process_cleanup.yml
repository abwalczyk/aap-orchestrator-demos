---
- name: Incidents | High CPU - Process Cleanup
  hosts: "{{ target_host | default('all') }}"
  become: true
  gather_facts: true
  vars:
    cpu_threshold: "{{ cpu_threshold_pct | default(80) }}"

  tasks:
    - name: Capture CPU usage before cleanup
      ansible.builtin.shell: |
        top -bn1 | head -3 | grep '%Cpu' | awk '{printf "%.0f", 100 - $8}'
      register: cpu_before
      changed_when: false

    - name: Identify high-CPU processes
      ansible.builtin.shell: |
        ps aux --sort=-%cpu | awk 'NR>1 && $3 > {{ cpu_threshold }} {print $2, $3, $11}' | head -10
      register: high_cpu_procs
      changed_when: false

    - name: Show high-CPU processes found
      ansible.builtin.debug:
        msg: "High CPU processes (>{{ cpu_threshold }}%): {{ high_cpu_procs.stdout_lines | default(['none found']) }}"

    - name: Check for known runaway process marker
      ansible.builtin.stat:
        path: /tmp/runaway_process.pid
      register: pid_marker

    - name: Read runaway process PID
      ansible.builtin.slurp:
        src: /tmp/runaway_process.pid
      register: runaway_pid_file
      when: pid_marker.stat.exists

    - name: Kill runaway process by PID marker
      ansible.builtin.shell: |
        PID="{{ (runaway_pid_file.content | b64decode | trim) }}"
        if kill -0 "$PID" 2>/dev/null; then
          kill "$PID"
          echo "Killed runaway process $PID"
        else
          echo "Process $PID already terminated"
        fi
      when: pid_marker.stat.exists
      changed_when: true
      ignore_errors: true

    - name: Kill any remaining high-CPU bash busy loops
      ansible.builtin.shell: |
        KILLED=0
        for PID in $(ps aux --sort=-%cpu | awk 'NR>1 && $3 > {{ cpu_threshold }} && $11 ~ /bash/ {print $2}'); do
          kill "$PID" 2>/dev/null && KILLED=$((KILLED+1))
        done
        echo "Killed $KILLED high-CPU bash processes"
      register: kill_result
      changed_when: "'Killed 0' not in kill_result.stdout"

    - name: Clean up PID marker file
      ansible.builtin.file:
        path: /tmp/runaway_process.pid
        state: absent
      when: pid_marker.stat.exists

    - name: Wait for CPU to stabilize
      ansible.builtin.pause:
        seconds: 5

    - name: Capture CPU usage after cleanup
      ansible.builtin.shell: |
        top -bn1 | head -3 | grep '%Cpu' | awk '{printf "%.0f", 100 - $8}'
      register: cpu_after
      changed_when: false

    - name: Check web service post-remediation
      ansible.builtin.shell: |
        CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null) && \
        TIME=$(curl -s -o /dev/null -w "%{time_total}" http://localhost:8080/health 2>/dev/null) && \
        echo "HTTP $CODE in ${TIME}s" || echo "unreachable"
      register: web_after
      changed_when: false
      ignore_errors: true

    - name: Report results
      ansible.builtin.debug:
        msg: |
          ============================================================
          PROCESS CLEANUP COMPLETE
          ============================================================
          CPU Before: {{ cpu_before.stdout }}% → After: {{ cpu_after.stdout }}%
          High-CPU processes found: {{ high_cpu_procs.stdout_lines | length }}
          {{ kill_result.stdout | default('No processes killed') }}
          Web service: {{ web_after.stdout | default('not checked') }}
          ============================================================

    - name: Publish results as artifacts
      ansible.builtin.set_stats:
        data:
          cpu_before: "{{ cpu_before.stdout }}"
          cpu_after: "{{ cpu_after.stdout }}"
          high_cpu_processes_found: "{{ high_cpu_procs.stdout_lines | length }}"
          processes_killed: "{{ kill_result.stdout | default('0') }}"
          web_check_after: "{{ web_after.stdout | default('not checked') }}"
          status: "completed"
