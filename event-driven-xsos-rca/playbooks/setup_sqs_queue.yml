---
- name: Setup AWS SQS queue for unknown-issue RCA events
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        aws_region: "{{ aws_region | default('us-east-1') }}"
        # Local laptop runs default to the "saml" SSO profile. On AAP, the job template's
        # attached AWS credential injects AWS_ACCESS_KEY_ID, which the boto3 calls below
        # detect automatically and use instead — no aws_profile override needed either place.
        aws_profile: "{{ aws_profile | default(lookup('env', 'AWS_PROFILE'), true) | default('saml', true) }}"
        xsos_event_queue_name: "{{ xsos_event_queue_name | default('aap-unknown-issue-rca') }}"

    - name: Create unknown-issue event queue
      ansible.builtin.command:
        cmd: >-
          python3 -c "import boto3, json, os; p=os.environ.pop('AWS_PROFILE', None); p=None if os.environ.get('AWS_ACCESS_KEY_ID') else p; s=boto3.Session(profile_name=p) if p else boto3.Session();
          r=s.client('sqs', region_name=os.environ['AWS_DEFAULT_REGION']).create_queue(QueueName=os.environ['QUEUE_NAME'],
          Attributes={'MessageRetentionPeriod':'345600','VisibilityTimeout':'300'},
          tags={'Demo':'event-driven-xsos-rca','ManagedBy':'ansible'});
          print(json.dumps(r))"
      register: sqs_create
      changed_when: sqs_create.rc == 0
      failed_when: sqs_create.rc != 0 and 'QueueAlreadyExists' not in sqs_create.stderr
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
        QUEUE_NAME: "{{ xsos_event_queue_name }}"

    - name: Resolve queue URL
      ansible.builtin.command:
        cmd: >-
          python3 -c "import boto3, json, os; p=os.environ.pop('AWS_PROFILE', None); p=None if os.environ.get('AWS_ACCESS_KEY_ID') else p; s=boto3.Session(profile_name=p) if p else boto3.Session();
          print(json.dumps(s.client('sqs', region_name=os.environ['AWS_DEFAULT_REGION']).get_queue_url(QueueName=os.environ['QUEUE_NAME'])))"
      register: sqs_url
      changed_when: false
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
        QUEUE_NAME: "{{ xsos_event_queue_name }}"

    - name: Show queue details for EDA and group_vars
      ansible.builtin.debug:
        msg:
          - "Queue name: {{ xsos_event_queue_name }}"
          - "Queue URL: {{ (sqs_url.stdout | from_json).QueueUrl }}"
          - "Region: {{ aws_region }}"
          - "Next: set sqs_queue_url in inventory/group_vars/all.yml to the URL above."
          - "Then configure an EDA rulebook source on this queue and map events to run_xsos_analysis.yml."
