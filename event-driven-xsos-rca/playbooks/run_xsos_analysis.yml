---
- name: Run xSOS analysis for unknown issue (AO / AAP triggered)
  hosts: "{{ _host | default('all') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        xsos_output_dir: "{{ xsos_output_dir | default('/var/tmp/xsos-rca') }}"
        xsos_install: "{{ xsos_install | default(true) | bool }}"
        xsos_sections: "{{ xsos_sections | default('--all') }}"
        resolved_issue_summary: "{{ issue_summary | default(summary | default('Unknown issue')) }}"
        report_stamp: "{{ ansible_date_time.epoch }}"
      run_once: true

    - name: Show resolved event context
      ansible.builtin.debug:
        msg:
          issue_summary: "{{ resolved_issue_summary }}"
          target: "{{ inventory_hostname }}"
      run_once: true

    - name: Ensure xSOS output directory exists
      ansible.builtin.file:
        path: "{{ xsos_output_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install xSOS when missing
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ryran/xsos/master/xsos
        dest: /usr/local/bin/xsos
        mode: "0755"
      when: xsos_install | bool

    - name: Verify xSOS is available
      ansible.builtin.command:
        cmd: /usr/local/bin/xsos -h
      register: xsos_help
      changed_when: false
      failed_when: xsos_help.rc != 0

    - name: Run xSOS analysis on target host
      ansible.builtin.command:
        cmd: "/usr/local/bin/xsos {{ xsos_sections }}"
      register: xsos_result
      changed_when: false

    - name: Save xSOS report on target host
      ansible.builtin.copy:
        content: |
          issue_summary: {{ resolved_issue_summary }}
          analyzed_host: {{ inventory_hostname }}
          analyzed_at: {{ ansible_date_time.iso8601 }}

          {{ xsos_result.stdout }}
        dest: "{{ xsos_output_dir }}/xsos-{{ report_stamp }}-{{ inventory_hostname }}.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Publish RCA artifacts for downstream automation orchestrator steps
      ansible.builtin.set_stats:
        data:
          issue_summary: "{{ resolved_issue_summary }}"
          analyzed_host: "{{ inventory_hostname }}"
          xsos_report_path: "{{ xsos_output_dir }}/xsos-{{ report_stamp }}-{{ inventory_hostname }}.txt"
          xsos_report_preview: "{{ xsos_result.stdout_lines[:40] | join('\n') }}"
        per_host: false
        aggregate: false
      run_once: true

    - name: Show xSOS summary
      ansible.builtin.debug:
        msg: "{{ xsos_result.stdout_lines[:25] }}"
