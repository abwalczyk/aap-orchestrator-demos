---
- name: Run xSOS analysis for unknown issue (EDA triggered)
  hosts: "{{ target_host | default(ansible_eda.event.body.host | default(ansible_eda.event.payload.host | default('rca-target'))) }}"
  become: true
  gather_facts: true
  vars:
    resolved_issue_id: >-
      {{
        issue_id
        | default(ansible_eda.event.body.issue_id | default(ansible_eda.event.payload.issue_id | default(ansible_eda.event.issue_id | default('unknown'))))
      }}
    resolved_issue_summary: >-
      {{
        issue_summary
        | default(ansible_eda.event.body.summary | default(ansible_eda.event.payload.summary | default(ansible_eda.event.summary | default('Unknown issue'))))
      }}
  tasks:
    - name: Show resolved event context
      ansible.builtin.debug:
        msg:
          issue_id: "{{ resolved_issue_id }}"
          issue_summary: "{{ resolved_issue_summary }}"
          target: "{{ inventory_hostname }}"
      run_once: true

    - name: Ensure xSOS output directory exists
      ansible.builtin.file:
        path: "{{ xsos_output_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install xSOS when missing
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ryran/xsos/master/xsos
        dest: /usr/local/bin/xsos
        mode: "0755"
      when: xsos_install | bool

    - name: Verify xSOS is available
      ansible.builtin.command:
        cmd: /usr/local/bin/xsos -h
      register: xsos_help
      changed_when: false
      failed_when: xsos_help.rc != 0

    - name: Run xSOS analysis on target host
      ansible.builtin.command:
        cmd: "/usr/local/bin/xsos {{ xsos_sections }}"
      register: xsos_result
      changed_when: false

    - name: Save xSOS report on target host
      ansible.builtin.copy:
        content: |
          issue_id: {{ resolved_issue_id }}
          issue_summary: {{ resolved_issue_summary }}
          analyzed_host: {{ inventory_hostname }}
          analyzed_at: {{ ansible_date_time.iso8601 }}

          {{ xsos_result.stdout }}
        dest: "{{ xsos_output_dir }}/xsos-{{ resolved_issue_id }}-{{ inventory_hostname }}.txt"
        owner: root
        group: root
        mode: "0644"

    - name: Publish RCA artifacts for downstream automation orchestrator steps
      ansible.builtin.set_stats:
        data:
          issue_id: "{{ resolved_issue_id }}"
          issue_summary: "{{ resolved_issue_summary }}"
          analyzed_host: "{{ inventory_hostname }}"
          xsos_report_path: "{{ xsos_output_dir }}/xsos-{{ resolved_issue_id }}-{{ inventory_hostname }}.txt"
          xsos_report_preview: "{{ xsos_result.stdout_lines[:40] | join('\n') }}"
        per_host: false
        aggregate: false
      run_once: true

    - name: Show xSOS summary
      ansible.builtin.debug:
        msg: "{{ xsos_result.stdout_lines[:25] }}"
