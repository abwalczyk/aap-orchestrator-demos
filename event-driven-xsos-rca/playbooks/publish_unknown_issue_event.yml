---
- name: Publish unknown issue event to SQS
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        aws_region: "{{ aws_region | default('us-east-1') }}"
        # Local laptop runs default to the "saml" SSO profile. On AAP, the job template's
        # attached AWS credential injects AWS_ACCESS_KEY_ID, which the boto3 calls below
        # detect automatically and use instead — no aws_profile override needed either place.
        aws_profile: "{{ aws_profile | default(lookup('env', 'AWS_PROFILE'), true) | default('saml', true) }}"
        xsos_event_queue_name: "{{ xsos_event_queue_name | default('aap-unknown-issue-rca') }}"
        target_host: "{{ target_host | default('rhel01-nostromo.demoredhat.com') }}"
        issue_summary: "{{ issue_summary | default('Unknown production issue — automated RCA requested') }}"
        issue_severity: "{{ issue_severity | default('high') }}"
        event_source: "{{ event_source | default('manual-demo') }}"

    - name: Build event payload
      ansible.builtin.set_fact:
        event_payload:
          issue_id: "{{ issue_id | default(lookup('pipe', 'date +%s')) }}"
          host: "{{ target_host }}"
          summary: "{{ issue_summary }}"
          severity: "{{ issue_severity }}"
          source: "{{ event_source }}"
          requested_action: xsos_analysis

    - name: Resolve queue URL when not provided
      ansible.builtin.command:
        cmd: >-
          python3 -c "import boto3, json, os; p=os.environ.pop('AWS_PROFILE', None); p=None if os.environ.get('AWS_ACCESS_KEY_ID') else p; s=boto3.Session(profile_name=p) if p else boto3.Session();
          print(json.dumps(s.client('sqs', region_name=os.environ['AWS_DEFAULT_REGION']).get_queue_url(QueueName=os.environ['QUEUE_NAME'])))"
      register: sqs_url_lookup
      changed_when: false
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
        QUEUE_NAME: "{{ xsos_event_queue_name }}"
      when: sqs_queue_url is not defined or sqs_queue_url | length == 0 or sqs_queue_url == 'CHANGEME'

    - name: Set queue URL from lookup
      ansible.builtin.set_fact:
        sqs_queue_url: "{{ (sqs_url_lookup.stdout | from_json).QueueUrl }}"
      when: sqs_url_lookup is not skipped

    - name: Validate SQS queue URL is configured
      ansible.builtin.assert:
        that:
          - sqs_queue_url is defined
          - sqs_queue_url | length > 0
          - sqs_queue_url != 'CHANGEME'
        fail_msg: >-
          Set sqs_queue_url extra var or ensure queue {{ xsos_event_queue_name }} exists in {{ aws_region }}.

    - name: Send unknown issue event to SQS
      ansible.builtin.command:
        cmd: >-
          python3 -c "import boto3, json, os; p=os.environ.pop('AWS_PROFILE', None); p=None if os.environ.get('AWS_ACCESS_KEY_ID') else p; s=boto3.Session(profile_name=p) if p else boto3.Session();
          print(json.dumps(s.client('sqs', region_name=os.environ['AWS_DEFAULT_REGION']).send_message(QueueUrl=os.environ['QUEUE_URL'], MessageBody=os.environ['MESSAGE_BODY'])))"
      register: sqs_send
      changed_when: sqs_send.rc == 0
      environment:
        AWS_PROFILE: "{{ aws_profile }}"
        AWS_DEFAULT_REGION: "{{ aws_region }}"
        QUEUE_URL: "{{ sqs_queue_url }}"
        MESSAGE_BODY: "{{ event_payload | to_json }}"

    - name: Show published event
      ansible.builtin.debug:
        msg:
          - "Published issue_id={{ event_payload.issue_id }} for host={{ event_payload.host }}"
          - "EDA should consume this message and launch run_xsos_analysis.yml."
          - "{{ sqs_send.stdout }}"
