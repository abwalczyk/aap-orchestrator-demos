# Local inventory for run_module rulebook testing.
#
# AAP EDA does NOT auto-discover this file. On the activation you must still
# attach a Controller inventory (e.g. Demo Inventory) in the UI.
#
# Local CLI example:
#   ansible-rulebook \
#     --inventory event-driven-xsos-rca/eda/inventory.ini \
#     --rulebook event-driven-xsos-rca/eda/rulebook-run-module.yml \
#     --vars-file event-driven-xsos-rca/inventory/group_vars/all.yml

[local]
localhost ansible_connection=local
