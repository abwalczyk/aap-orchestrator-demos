---
# AAP discovers rulebooks from extensions/eda/rulebooks/ at the repo root.
# This file mirrors extensions/eda/rulebooks/event-driven-xsos-rca.yml for local browsing.
- name: Unknown issue xSOS RCA
  hosts: all
  sources:
    - name: unknown_issue_sqs
      amazon.aws.aws_sqs_queue:
        region: "{{ aws_region | default('us-east-1') }}"
        name: "{{ xsos_event_queue_name | default('aap-unknown-issue-rca') }}"
        delay_seconds: 5
  rules:
    - name: Run xSOS analysis for unknown issue events
      condition: >-
        event.body is defined
        and event.body.requested_action is defined
        and event.body.requested_action == "xsos_analysis"
      action:
        run_job_template:
          name: "{{ xsos_job_template_name | default('Linux - Run xSOS Analysis') }}"
          organization: "{{ aap_organization | default('Default') }}"
          add_event_uuid_label: true
          job_args:
            extra_vars:
              target_host: "{{ event.body.host }}"
              issue_id: "{{ event.body.issue_id }}"
              issue_summary: "{{ event.body.summary }}"
              issue_severity: "{{ event.body.severity | default('unknown') }}"
