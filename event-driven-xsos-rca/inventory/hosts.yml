---
all:
  children:
    linux:
      hosts:
        rca-target:
          ansible_host: "{{ lookup('env', 'RCA_TARGET_HOST') | default('CHANGEME', true) }}"
          ansible_user: "{{ lookup('env', 'RCA_TARGET_USER') | default('ec2-user', true) }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'RCA_TARGET_SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
