---
aws_region: us-east-1

# Queue name used by setup_sqs_queue.yml. After setup, copy the printed URL here.
xsos_event_queue_name: aap-unknown-issue-rca
sqs_queue_url: https://sqs.us-east-1.amazonaws.com/962147768365/aap-unknown-issue-rca

# Automation orchestrator EDA webhook (from AO trigger UI → URL field)
ao_webhook_url: http://54.159.25.87:8080/api/v1/webhooks/eda/357ce7cf-0138-409f-ad36-f2a9c2a97c50
ao_webhook_validate_certs: false

# OAuth2 client credentials for the AO webhook (from AO trigger UI).
# Set these on the EDA rulebook activation as extra vars — do not commit secrets here.
# ao_webhook_client_id: "<from activation extra vars>"
# ao_webhook_client_secret: "<from activation extra vars>"
# ao_webhook_token_url: "https://54.159.25.87/o/token/"

# Default demo event fields for publish_unknown_issue_event.yml
target_host: rhel01-nostromo.demoredhat.com
issue_summary: Unknown production issue — automated RCA requested
issue_severity: high
event_source: manual-demo

# xSOS runtime options (see xsos -h)
xsos_install: true
xsos_output_dir: /var/tmp/xsos-rca
xsos_sections: --all
