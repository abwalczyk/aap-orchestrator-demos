cve-remediation:
  status: active
  items:
    - name: cve_fetch_and_commit.yml
      path: cve-remediation/aap/playbooks/cve_fetch_and_commit.yml
      description: Downloads the Lightspeed-generated remediation playbook and commits it to Gitea for AAP project sync.
      runs_on: localhost (Lightspeed MCP + Gitea)
    - name: cve_sync_and_deploy.yml
      path: cve-remediation/aap/playbooks/cve_sync_and_deploy.yml
      description: Syncs the AAP project from Gitea, creates a scoped job template for the CVE playbook, and launches it.
      runs_on: localhost (AAP API)
    - name: notify_mattermost_cve.yml
      path: cve-remediation/aap/playbooks/notify_mattermost_cve.yml
      description: Posts a structured CVE investigation report to Mattermost when no errata is available.
      runs_on: localhost (Mattermost API)

disk-utilization:
  status: active
  items:
    - name: check_disk.yml
      path: disk-utilization/playbooks/check_disk.yml
      description: Reads filesystem usage on the target mount and publishes disk_use_percent and disk_tier artifacts for the switch.
      runs_on: RHEL EC2 node
    - name: remediate_disk_continue.yml
      path: disk-utilization/playbooks/remediate_disk_continue.yml
      description: Healthy path when disk is below the warning threshold. Logs status and publishes notify artifacts with no changes to the host.
      runs_on: RHEL EC2 node
    - name: remediate_disk_cleanup.yml
      path: disk-utilization/playbooks/remediate_disk_cleanup.yml
      description: Reclaims dnf package cache and old log archives, then publishes before/after usage stats for the warning notify tier.
      runs_on: RHEL EC2 node
    - name: remediate_disk_expand.yml
      path: disk-utilization/playbooks/remediate_disk_expand.yml
      description: Increases the root EBS volume in AWS, then runs growpart and xfs_growfs on the host for the critical expand path.
      runs_on: AWS (localhost) + RHEL EC2 node
    - name: remediate_disk_fallback.yml
      path: disk-utilization/playbooks/remediate_disk_fallback.yml
      description: Handles unexpected switch tiers (e.g. boundary values) with no remediation and publishes artifacts for the unsupported notify template.
      runs_on: RHEL EC2 node
    - name: notify_chatroom.yml
      path: disk-utilization/playbooks/notify_chatroom.yml
      description: Includes the tier-specific Mattermost template (ok, warn, critical, unsupported) and posts the remediation summary to chat.
      runs_on: localhost (Mattermost API)

cert-lifecycle:
  status: active
  items:
    - name: renew_certificate.yml
      path: cert-lifecycle/playbooks/renew_certificate.yml
      description: Pulls a new PEM certificate from Vault CA, installs it for nginx, and reloads the service.
      runs_on: RHEL node (nginx / PEM)
    - name: renew_keystore_certificate.yml
      path: cert-lifecycle/playbooks/renew_keystore_certificate.yml
      description: Renews a Java keystore certificate for the API server, updating the keystore and restarting the application.
      runs_on: RHEL node (Java keystore)
    - name: validate_certificate.yml
      path: cert-lifecycle/playbooks/validate_certificate.yml
      description: Runs an OpenSSL TLS handshake check and reports certificate subject, issuer, and expiry after renewal.
      runs_on: RHEL node
    - name: notify_mattermost.yml
      path: cert-lifecycle/playbooks/notify_mattermost.yml
      description: Posts renewal status, agent confidence, and analysis summary to Mattermost after the workflow completes.
      runs_on: localhost (Mattermost API)

