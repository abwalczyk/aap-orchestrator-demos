---
- name: Lightwell | Check Compliance Posture
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Set base compliance facts
      ansible.builtin.set_fact:
        compliance_result:
          policy_bundle: "{{ policy_bundle | default('lightwell-fast-path') }}"
          sbom_required: "{{ sbom_attached | default('true') | bool }}"
          vex_required: "{{ vex_attached | default('true') | bool }}"
          cve_blockers: "{{ cve_blockers | default(0) | int }}"

    - name: Set posture to non_compliant when CVE blockers exist
      ansible.builtin.set_fact:
        compliance_result: "{{ compliance_result | combine({'posture': 'non_compliant'}) }}"
      when: (cve_blockers | default(0) | int) > 0

    - name: Set posture to needs_review when SBOM or VEX evidence is missing
      ansible.builtin.set_fact:
        compliance_result: "{{ compliance_result | combine({'posture': 'needs_review'}) }}"
      when:
        - compliance_result.posture is not defined
        - not (sbom_attached | default('true') | bool) or not (vex_attached | default('true') | bool)

    - name: Set posture to compliant when checks pass
      ansible.builtin.set_fact:
        compliance_result: "{{ compliance_result | combine({'posture': 'compliant'}) }}"
      when: compliance_result.posture is not defined

    - name: Report compliance summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          COMPLIANCE POSTURE CHECK
          ============================================================
          Policy bundle: {{ compliance_result.policy_bundle }}
          SBOM required: {{ compliance_result.sbom_required }}
          VEX required:  {{ compliance_result.vex_required }}
          CVE blockers:  {{ compliance_result.cve_blockers }}
          Posture:       {{ compliance_result.posture }}
          ============================================================

    - name: Publish compliance artifacts
      ansible.builtin.set_stats:
        data:
          compliance_posture: "{{ compliance_result.posture }}"
          policy_bundle: "{{ compliance_result.policy_bundle }}"
          cve_blockers: "{{ compliance_result.cve_blockers | string }}"
          compliance_status: "{{ 'passed' if compliance_result.posture == 'compliant' else 'failed' }}"
          status: "completed"
